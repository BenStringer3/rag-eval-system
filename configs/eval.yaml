# Evaluation Configuration

tracking:
  # Local MLflow backend for eval runs, traces, and scorer outputs.
  uri: "sqlite:///data/mlflow.db"
  experiment: "rag-eval-system"

judge:
  # Native MLflow judge URI. Examples:
  # - openai:/gpt-4o-mini-2024-07-18
  # - openai:/mistralai/devstral-small-2-2512 (with LM Studio base_url below)
  model: "openai:/gpt-4o-mini-2024-07-18"
  openai:
    # OpenAI-compatible endpoint used by MLflow DeepEval scorers.
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    # Optional fallback for local OpenAI-compatible servers like LM Studio.
    # api_key: "lm-studio"

metrics:
  # Core RAG metrics (DeepEval built-in)
  faithfulness:
    enabled: true
    threshold: 0.7
  answer_relevancy:
    enabled: true
    threshold: 0.7
  contextual_precision:
    enabled: true
    threshold: 0.6
  contextual_recall:
    enabled: true
    threshold: 0.6

datasets:
  # Each entry is a JSON file (see data/eval_datasets/*.json). run_eval.py runs
  # every dataset unless --dataset is set. Set enabled: false to skip one.
  starter:
    enabled: false
    path: "data/eval_datasets/starter.json"
    description: "Hand-curated Q&A pairs for initial baseline"

  synthetic:
    enabled: true
    path: "data/eval_datasets/synthetic.json"
    description: "Extra corpus-grounded pairs; can be replaced by DeepEval synthesizer output"

visualization:
  umap:
    n_neighbors: 15
    min_dist: 0.1
    n_components: 3  # 3D projection
    metric: "cosine"
  cache_embeddings: true
  cache_dir: "data/embeddings/umap_cache"
