# Evaluation Configuration

judge:
  # DeepEval metrics call this model via LM Studio's OpenAI-compatible API.
  # base_url and api_key are read from configs/default.yaml → lm_studio.
  model: "mistralai/devstral-small-2-2512"
  temperature: 0
  # Forwarded to chat.completions.create on every judge call.
  # LM Studio 0.4.x accepts response_format.type values "json_schema" and "text".
  # We request JSON-object output shape to improve parse reliability for DeepEval metrics.
  generation_kwargs:
    response_format:
      type: json_schema
      json_schema:
        # Name is required by OpenAI-compatible structured output payloads.
        name: "deepeval_judge_response"
        # strict=false keeps schema permissive because different DeepEval metrics
        # ask the judge for different JSON keys.
        strict: false
        schema:
          # Require top-level JSON object while allowing metric-specific fields.
          type: object
          additionalProperties: true

metrics:
  # Core RAG metrics (DeepEval built-in)
  faithfulness:
    enabled: true
    threshold: 0.7
  answer_relevancy:
    enabled: true
    threshold: 0.7
  contextual_precision:
    enabled: true
    threshold: 0.6
  contextual_recall:
    enabled: true
    threshold: 0.6

  # Custom metrics (extend in src/eval/metrics.py)
  code_accuracy:
    enabled: false  # Enable in phase 2
    threshold: 0.8
    criteria: "Does the response contain syntactically correct code that matches the query intent?"
  diagram_fidelity:
    enabled: false  # Enable in phase 2
    threshold: 0.7
    criteria: "Does the response accurately describe the structure/flow shown in the diagram?"

datasets:
  # Each entry is a JSON file (see data/eval_datasets/*.json). run_eval_report.py runs
  # every dataset unless --dataset is set. Set enabled: false to skip one.
  starter:
    enabled: false
    path: "data/eval_datasets/starter.json"
    description: "Hand-curated Q&A pairs for initial baseline"

  synthetic:
    enabled: true
    path: "data/eval_datasets/synthetic.json"
    description: "Extra corpus-grounded pairs; can be replaced by DeepEval synthesizer output"

visualization:
  umap:
    n_neighbors: 15
    min_dist: 0.1
    n_components: 3  # 3D projection
    metric: "cosine"
  cache_embeddings: true
  cache_dir: "data/embeddings/umap_cache"
