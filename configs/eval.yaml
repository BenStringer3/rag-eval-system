# Evaluation Configuration

judge:
  # DeepEval metrics call this model via LM Studio's OpenAI-compatible API.
  # base_url and api_key are read from configs/default.yaml → lm_studio.
  model: "qwen/qwen3.5-35b-a3b"
  temperature: 0
  # Forwarded to chat.completions.create. For vLLM / servers that honor Qwen's template flags,
  # extra_body.chat_template_kwargs disables chain-of-thought at the engine. LM Studio's
  # documented OpenAI payload is smaller and may ignore extra_body; the judge strips
  # Qwen-style think/thinking fenced blocks from model output before JSON parsing.
  generation_kwargs:
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

metrics:
  # Core RAG metrics (DeepEval built-in)
  faithfulness:
    enabled: true
    threshold: 0.7
  answer_relevancy:
    enabled: true
    threshold: 0.7
  contextual_precision:
    enabled: true
    threshold: 0.6
  contextual_recall:
    enabled: true
    threshold: 0.6

  # Custom metrics (extend in src/eval/metrics.py)
  code_accuracy:
    enabled: false  # Enable in phase 2
    threshold: 0.8
    criteria: "Does the response contain syntactically correct code that matches the query intent?"
  diagram_fidelity:
    enabled: false  # Enable in phase 2
    threshold: 0.7
    criteria: "Does the response accurately describe the structure/flow shown in the diagram?"

datasets:
  # Starter eval dataset shipped with the project
  starter:
    path: "data/eval_datasets/starter.json"
    description: "Hand-curated Q&A pairs for initial baseline"

  # Placeholder for future synthetic dataset
  # synthetic:
  #   path: "data/eval_datasets/synthetic.json"
  #   description: "LLM-generated eval pairs via DeepEval synthesizer"

visualization:
  umap:
    n_neighbors: 15
    min_dist: 0.1
    n_components: 3  # 3D projection
    metric: "cosine"
  cache_embeddings: true
  cache_dir: "data/embeddings/umap_cache"
