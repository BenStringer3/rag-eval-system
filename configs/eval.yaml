# Evaluation Configuration

judge:
  # Select which endpoint DeepEval uses for metric-judge calls.
  # - openai: use judge.openai.* (cloud)
  # - local: use configs/default.yaml -> lm_studio.* (LM Studio)
  provider: "openai"
  # Judge model id passed to chat.completions.create.
  # gpt-4o-mini supports native structured output / JSON mode and is low-cost.
  model: "gpt-4o-mini"
  # Sampling temperature for judge outputs (0 = deterministic).
  temperature: 0
  openai:
    # OpenAI API base URL for cloud judge calls.
    # Keep /v1 suffix because GPTModel forwards this directly to OpenAI client.
    base_url: "https://api.openai.com/v1"
    # Environment variable name containing the OpenAI API key.
    # Expected in runtime env (for example via .env loading in your shell).
    api_key_env: "OPENAI_API_KEY"
  # Intentionally omit generation_kwargs.response_format here.
  # For this model, DeepEval uses the schema-enforced parse path when available,
  # which is stricter than plain json_object mode.

metrics:
  # Core RAG metrics (DeepEval built-in)
  faithfulness:
    enabled: true
    threshold: 0.7
  answer_relevancy:
    enabled: true
    threshold: 0.7
  contextual_precision:
    enabled: true
    threshold: 0.6
  contextual_recall:
    enabled: true
    threshold: 0.6

  # Custom metrics (extend in src/eval/metrics.py)
  code_accuracy:
    enabled: false  # Enable in phase 2
    threshold: 0.8
    criteria: "Does the response contain syntactically correct code that matches the query intent?"
  diagram_fidelity:
    enabled: false  # Enable in phase 2
    threshold: 0.7
    criteria: "Does the response accurately describe the structure/flow shown in the diagram?"

datasets:
  # Each entry is a JSON file (see data/eval_datasets/*.json). run_eval_report.py runs
  # every dataset unless --dataset is set. Set enabled: false to skip one.
  starter:
    enabled: false
    path: "data/eval_datasets/starter.json"
    description: "Hand-curated Q&A pairs for initial baseline"

  synthetic:
    enabled: true
    path: "data/eval_datasets/synthetic.json"
    description: "Extra corpus-grounded pairs; can be replaced by DeepEval synthesizer output"

visualization:
  umap:
    n_neighbors: 15
    min_dist: 0.1
    n_components: 3  # 3D projection
    metric: "cosine"
  cache_embeddings: true
  cache_dir: "data/embeddings/umap_cache"
