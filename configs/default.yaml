# RAG Pipeline Configuration
# Inference via LM Studio local server (OpenAI-compatible /v1 API).

# LM Studio: run `lms server start`, then `lms load <model>` for embedding + chat models.
lm_studio:
  # Root URL for OpenAI-compatible endpoints (embeddings, chat completions).
  base_url: "http://localhost:1234/v1"
  # LM Studio accepts any string here when no API key is configured (see LM Studio openai-compat docs).
  api_key: "lm-studio"

embedding:
  # Must match the model id shown in LM Studio / GET /v1/models (e.g. after `lms load`).
  model: "text-embedding-nomic-embed-text-v1.5"
  dimensions: 768
  # Prefix tokens required by Nomic embed models
  query_prefix: "search_query: "
  document_prefix: "search_document: "

chunking:
  # Options: recursive (current), semantic / tree-sitter (phase 3).
  # See docs/rag-improvements-2026-03-24.md for chunk size rationale and sources.
  strategy: "recursive"
  chunk_size: 1024
  chunk_overlap: 128
  # File-type-specific overrides
  overrides:
    markdown:
      # 1024 chars keeps most documentation sections whole; avoids mid-sentence
      # splits that caused syn003-style "I don't know" failures in the eval.
      # 12.5% overlap (128/1024) — within the 10–20% range recommended by
      # Firecrawl 2026 benchmarks for dense retrievers.
      chunk_size: 1024
      chunk_overlap: 128
      separators: ["\n## ", "\n### ", "\n#### ", "\n\n", "\n", " "]
    code:
      # Code chunks stay smaller — function bodies are typically 200–400 chars.
      # Phase 3: replace with tree-sitter AST-aware chunking (chonkie CodeChunker
      # or treesitter-chunker) for proper function/class boundary splitting.
      chunk_size: 512
      chunk_overlap: 64
      separators: ["\nclass ", "\ndef ", "\nasync def ", "\n\n", "\n", " "]
    mermaid:
      # Mermaid diagrams should stay whole when possible.
      chunk_size: 1024
      chunk_overlap: 0
      separators: ["\n\n", "\n"]

vector_store:
  provider: "chromadb"
  persist_directory: "./data/embeddings/chromadb"
  collection_name: "rag_docs"
  distance_metric: "cosine"

retrieval:
  top_k: 5
  # score_threshold: 0.3  # Uncomment to filter low-relevance results

generation:
  # Chat model id as exposed by LM Studio (load with `lms load` before querying).
  model: "mistralai/devstral-small-2-2512"
  temperature: 0.0
  max_tokens: 1024
  # Additional chat.completions parameters for the app generation path.
  # Keep empty unless you need model-specific behavior beyond the defaults above.
  # Grounding constraint: "ONLY" + explicit prohibition of outside knowledge
  # targets the 6 faithfulness failures from the 2026-03-24 eval.
  system_prompt: |
    You are a technical assistant. Answer questions using ONLY the provided context.
    Do not add information from your own knowledge — if the context does not contain
    enough information, say what is missing rather than guessing.

    Context:
    {context}
